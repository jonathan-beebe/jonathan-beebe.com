<ul>
{{- range (
  where (
    where site.RegularPages "Section" "posts"
  ) "Params.skipHome" "ne" true | first 3
) }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a> <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    </li>
{{ end }}
</ul>
