{{ define "main" }}
<main>
  <h1>
    {{ .Title }}
  </h1>
  {{ with .OutputFormats.Get "rss" -}}
    <small>Subscribe to the <a class="decorate" href="{{ .RelPermalink }}">rss feed here</a>.</small>
  {{ end }}
  <ul role="list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    </li>
    {{ end }}
  </ul>
</main>
{{ end }}
