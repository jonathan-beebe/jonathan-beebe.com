baseURL = 'https://jonathan-beebe.com/'
locale = 'en-us'
title = 'The personal site of Jonathan Beebe'
sectionPagesMenu = "main"
enableRobotsTXT = true
copyright = '© 2026 Jonathan Beebe'
capitalizeListTitles = false

[params]
  [params.author]
    email = 'jonathan-beebe@outlook.com'
    name = 'Jonathan Beebe'

[menu]
[[menu.main]]
  pageRef = "/"
  name = 'Home'
  weight = 10
[[menu.footer]]
  name = 'Contact'
  url = '/about#contact'
[[menu.footer]]
  name = 'RSS'
  url = '/posts/index.xml'
  

[module]
  [module.hugoVersion]
    min = "0.164.0"

  [[module.mounts]]
    source = "assets/fonts"
    target = "static/fonts"

  [[module.mounts]]
    source = "static"
    target = "static"

[outputs]
  home = ['html']
  section = ['html', 'rss']
  taxonomy = ['html']
  term = ['html']